[package]
name = "ai-quota-desk"
version = "0.1.0"
description = "Desktop widget showing remaining quota for GLM Coding Plan / Kimi for Coding / ChatGPT Codex"
edition = "2021"

[lib]
name = "ai_quota_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "gzip"] }
futures = "0.3"
chrono = "0.4"
dirs = "5"

[profile.dev]
incremental = true
